version: '3.8'

# ==============================================================================
# 🐳 AI Personal Finance & Investment Assistant - Docker Compose
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 🐍 Backend API & Ingestion Engine (FastAPI + LangGraph)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Finance AI Assistant
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////data/finance.db
      - FINANCE_DATA_DIR=/data
      - FINANCIAL_STATEMENTS_DIR=/app/FinancialStatements
      - GOOGLE_DRIVE_LEDGER_PATH=/data/MonthlyLedger.xlsx
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_COPILOT_MODEL=llama3.2:3b
      - MARKET_SYNC_ENABLED=true
      - AUTO_DRIVE_SYNC_ENABLED=true
    volumes:
      - finance-data:/data
      - ./FinancialStatements:/app/FinancialStatements
      - ./models:/models
    networks:
      - finance-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 🌐 Frontend Web Application (Next.js 14 + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finance-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 🤖 Local Ollama AI Engine (Optional / Containerized LLM)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: finance-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - finance-net
    # Enable NVIDIA GPU Acceleration if NVIDIA Container Toolkit is installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

# ==============================================================================
# 💾 Persistent Storage Volumes & Networks
# ==============================================================================
volumes:
  finance-data:
    name: finance_assistant_data
  ollama-models:
    name: finance_assistant_ollama_models

networks:
  finance-net:
    name: finance_assistant_net
    driver: bridge
